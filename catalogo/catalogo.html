<style>
:root{--cr:#EAE3D4;--dk:#1C1810;--dk2:#3A3020;--gd:#a77436;--gd2:#c08840;--wh:#FDFAF4;}
@font-face{font-family:'Baskerville';src:url('../fonts/Baskerville.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:var(--dk);color:var(--wh);overflow-x:hidden}

@keyframes fi{to{opacity:1}}
@keyframes fiu{to{opacity:1;transform:translateY(0)}}
@keyframes fisc{to{opacity:1;transform:scale(1)}}

.hero{height:100vh;min-height:680px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;background:url('../images/hero-composicao.jpg') center/cover no-repeat;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:rgba(28,24,16,.62);z-index:0}
.hero::after{content:'';position:absolute;top:36px;left:36px;right:36px;bottom:36px;border:1px solid rgba(167,116,54,.18);pointer-events:none}
.hc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.hmono{width:96px;height:auto;margin-bottom:32px;margin-left:-5px;opacity:0;transform:scale(.8);animation:fisc 1s ease .3s forwards}
.hbn{opacity:0;transform:translateY(18px);animation:fiu 1s ease .6s forwards;width:clamp(200px,34vw,360px);max-width:82vw;height:auto}
.hbn g{fill:#FDFAF4}
.hdiv{width:52px;height:1px;background:var(--gd);margin:22px auto;opacity:0;animation:fi 1s ease 1.1s forwards}
.hsub{font-size:10px;font-weight:600;letter-spacing:6px;text-transform:uppercase;color:rgba(253,250,244,.95);text-shadow:0 2px 18px rgba(28,24,16,.85);opacity:0;animation:fi 1s ease 1.3s forwards}
.htag{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,2vw,20px);font-weight:400;font-style:italic;color:rgba(253,250,244,.95);text-shadow:0 2px 18px rgba(28,24,16,.85);margin-top:36px;max-width:460px;line-height:1.7;opacity:0;animation:fi 1s ease 1.5s forwards}
.hbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:44px;opacity:0;animation:fi 1s ease 1.7s forwards}
.bp{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--wh);background:var(--dk);border:1px solid var(--dk);padding:15px 34px;text-decoration:none;transition:all .3s}
.bp:hover{background:var(--gd);border-color:var(--gd)}
.bo{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#FDFAF4;background:transparent;border:1px solid rgba(253,250,244,.4);padding:15px 34px;text-decoration:none;transition:all .3s}
.bo:hover{background:rgba(253,250,244,.1);color:#FDFAF4}

@media(max-width:768px){
  .hero::after{top:20px;left:16px;right:16px;bottom:20px}
  .hmono{width:72px;height:auto;margin-bottom:18px}
  .hbn{width:clamp(190px,70vw,320px)}
  .hdiv{margin:14px auto}
  .htag{margin-top:24px;max-width:88vw;font-size:19px}
  .hero::before{background:rgba(28,24,16,.72)}
  .hbtns{margin-top:28px;gap:12px}
}
</style>
